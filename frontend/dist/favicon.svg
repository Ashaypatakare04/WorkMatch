<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="wmGradient" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#07090E" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Canvas -->
  <rect width="64" height="64" rx="16" fill="url(#bgGradient)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" />
  
  <!-- Subtle Grid/Aperture Rings -->
  <circle cx="32" cy="32" r="23" stroke="rgba(6, 182, 212, 0.15)" stroke-width="1" stroke-dasharray="3 3" />
  <circle cx="32" cy="32" r="16" stroke="rgba(16, 185, 129, 0.2)" stroke-width="1" />

  <!-- Interlocking W-M Opportunity Mark -->
  <path d="M15 20L22 44L28 28L32 36L36 28L42 44L49 20" 
        stroke="url(#wmGradient)" 
        stroke-width="4.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#glow)" />
        
  <!-- Precision Match Radar Dot -->
  <circle cx="32" cy="18" r="3" fill="#10B981" />
  <circle cx="32" cy="18" r="5" stroke="#10B981" stroke-width="1" opacity="0.6" />
</svg>
