  <!-- Alignment Radar Track Ring -->
  <circle cx="32" cy="32" r="22" stroke="#06B6D4" stroke-opacity="0.25" stroke-width="1" stroke-dasharray="3 3" />

  <!-- Concept 1 Nexus WM Arrow Monogram -->
  <!-- Left W Stem -->
  <path
    d="M14 25V42C14 43.6 15.3 45 17 45H18.5C20.2 45 21.5 43.6 21.5 42V33.5L26.5 43.2C27.1 44.3 28.6 44.4 29.3 43.4L35.5 33.5V42C35.5 43.6 36.8 45 38.5 45H40C41.6 45 43 43.6 43 42V31"
    stroke="url(#wmNexusGrad)"
    stroke-width="4.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Upward Opportunity Arrow (M Dynamic Surge) -->
  <path
    d="M35.5 30.5L48.5 15.5M48.5 15.5H38.5M48.5 15.5V25.5"
    stroke="url(#wmNexusGrad)"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Precision Focus Radar Node -->
  <circle cx="28" cy="22" r="3" fill="#10B981" />
  <circle cx="28" cy="22" r="5" stroke="#10B981" stroke-width="1" stroke-opacity="0.5" />
</svg>
