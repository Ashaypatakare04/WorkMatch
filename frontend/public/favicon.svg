<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="wmNexusGrad" x1="12" y1="50" x2="52" y2="14" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="wmBorderGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#06B6D4" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <!-- Crisp Squircle Badge (Ensures bold visibility on both light and dark browser chrome tabs) -->
