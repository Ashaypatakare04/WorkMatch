  <circle cx="32" cy="32" r="23" stroke="rgba(6, 182, 212, 0.2)" stroke-width="1" stroke-dasharray="3 3" />

  <!-- Nexus WM Arrow Monogram -->
  <!-- Left W -->
  <path d="M13 24V43C13 44.7 14.3 46 16 46H17.5C19.2 46 20.5 44.7 20.5 43V33.5L26.2 43.8C26.8 44.9 28.4 45 29.1 44L36 33.5V43C36 44.7 37.3 46 39 46H40.5C42.2 46 43.5 44.7 43.5 43V30.5" 
